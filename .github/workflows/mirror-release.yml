# 本文件属于 Fork overlay：上游同步后必须保留。
# 职责：每小时对齐 jeequan/jeepay；按 isys.version 在 GitHub 构建 linux/amd64 镜像，
# 推 GHCR，再拷贝到 CNB。不在 CNB 二次构建，不用华为 SWR。
name: 同步上游并发布镜像

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: jeepay-mirror
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  UPSTREAM_REPO: jeequan/jeepay
  OVERLAY_FILES: ".github/workflows/mirror-release.yml .cnb.yml"
  SERVICES: "jeepay-manager jeepay-merchant jeepay-payment"

jobs:
  sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: 同步上游 master
        id: sync
        env:
          OVERLAY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin master
          git checkout -B master origin/master

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || true
          git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "已包含上游最新提交，无需同步"
            exit 0
          fi

          restore_overlay() {
            # 用启动本次工作流的版本覆盖 overlay，避免被上游同名文件带走
            # shellcheck disable=SC2086
            git checkout "$OVERLAY_SHA" -- $OVERLAY_FILES
            # shellcheck disable=SC2086
            git add -- $OVERLAY_FILES
          }

          # GITHUB_TOKEN 不能创建或更新 workflow 文件。overlay 以外的
          # .github/workflows 保持本仓库当前版本，不随上游带走。
          drop_non_overlay_workflows() {
            local f
            {
              git diff --name-only --cached -- .github/workflows
              git ls-files -u -- .github/workflows | awk '{print $4}'
            } | sort -u | while read -r f; do
              [ -z "$f" ] && continue
              case " ${OVERLAY_FILES} " in
                *" ${f} "*) continue ;;
              esac
              if git cat-file -e "HEAD:${f}" 2>/dev/null; then
                echo "不同步上游 workflow: 还原 ${f}"
                git checkout HEAD -- "$f"
              else
                echo "不同步上游 workflow: 去掉 ${f}"
                git rm -f --ignore-unmatch -- "$f"
              fi
            done
          }

          git merge --no-commit --no-ff upstream/master || true
          if [ ! -f .git/MERGE_HEAD ]; then
            echo "上游合并未开始" >&2
            git status
            exit 1
          fi

          restore_overlay
          drop_non_overlay_workflows

          leftover="$(git ls-files -u | awk '{print $4}' | sort -u | grep -v -E '^(\.github/workflows/mirror-release\.yml|\.cnb\.yml)$' || true)"
          if [ -n "$leftover" ]; then
            echo "存在无法自动解决的合并冲突:" >&2
            echo "$leftover" >&2
            git status
            exit 1
          fi

          git commit --no-edit
          git push origin HEAD:master
          echo "changed=true" >> "$GITHUB_OUTPUT"

  release:
    needs: sync
    if: |
      always() &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (needs.sync.result == 'success' && needs.sync.outputs.changed == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
      CNB_REPO: ${{ vars.CNB_REPO }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: 解析版本
        id: ver
        run: |
          set -euo pipefail
          raw="$(sed -n 's/.*<isys.version>\([^<]*\)<\/isys.version>.*/\1/p' pom.xml | head -1 | tr -d '[:space:]')"
          if ! echo "$raw" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "pom.xml isys.version 必须是 x.y.z，当前是: ${raw}" >&2
            exit 1
          fi
          echo "version=v${raw}" >> "$GITHUB_OUTPUT"
          echo "使用版本 v${raw}"

      - name: 检查版本是否已发布
        id: published
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          python3 - "$owner" "$VERSION" "${CNB_REPO:-}" $SERVICES <<'PY'
          import json, os, sys, urllib.request, urllib.error

          owner, version, cnb_repo, *svcs = sys.argv[1:]
          accept = (
              "application/vnd.oci.image.index.v1+json, "
              "application/vnd.docker.distribution.manifest.list.v2+json, "
              "application/vnd.oci.image.manifest.v1+json, "
              "application/vnd.docker.distribution.manifest.v2+json"
          )

          def cnb_token(repo):
              req = urllib.request.Request("https://docker.cnb.cool/v2/")
              try:
                  urllib.request.urlopen(req, timeout=20)
                  return ""
              except urllib.error.HTTPError as e:
                  www = e.headers.get("Www-Authenticate") or e.headers.get("WWW-Authenticate") or ""
                  kv = {}
                  if " " in www:
                      for item in www.split(" ", 1)[1].split(","):
                          if "=" in item:
                              k, v = item.split("=", 1)
                              kv[k.strip()] = v.strip().strip('"')
                  realm = kv.get("realm") or "https://docker.cnb.cool/service/token"
                  service = kv.get("service") or "cnb-registry"
                  sep = "&" if "?" in realm else "?"
                  url = f"{realm}{sep}service={service}&scope=repository:{repo}:pull"
                  with urllib.request.urlopen(url, timeout=20) as r:
                      data = json.loads(r.read())
                  return data.get("token") or data.get("access_token") or ""

          def ghcr_token(repo):
              url = f"https://ghcr.io/token?service=ghcr.io&scope=repository:{repo}:pull"
              with urllib.request.urlopen(url, timeout=20) as r:
                  return json.load(r).get("token") or ""

          def get_manifest(host, repo, ref, token):
              req = urllib.request.Request(f"https://{host}/v2/{repo}/manifests/{ref}")
              if token:
                  req.add_header("Authorization", f"Bearer {token}")
              req.add_header("Accept", accept)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read()), r.headers.get("Docker-Content-Digest") or ""
              except urllib.error.HTTPError as e:
                  if e.code in (401, 404):
                      return None, ""
                  raise

          def config_arch(host, repo, manifest, token):
              cfg = (manifest.get("config") or {}).get("digest")
              if not cfg:
                  return ""
              req = urllib.request.Request(f"https://{host}/v2/{repo}/blobs/{cfg}")
              if token:
                  req.add_header("Authorization", f"Bearer {token}")
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read()).get("architecture") or ""

          def real_arches(host, repo, tag, token):
              man, digest = get_manifest(host, repo, tag, token)
              if man is None:
                  return None, digest
              out = []
              if man.get("manifests"):
                  for m in man["manifests"]:
                      labeled = (m.get("platform") or {}).get("architecture") or ""
                      if labeled in ("", "unknown"):
                          continue
                      child, _ = get_manifest(host, repo, m["digest"], token)
                      if not child:
                          continue
                      out.append((labeled, config_arch(host, repo, child, token)))
              else:
                  out.append(("single", config_arch(host, repo, man, token)))
              return out, digest

          def amd64_ok(pairs):
              if not pairs:
                  return False
              for labeled, real in pairs:
                  if labeled == "amd64" and real != "amd64":
                      return False
              return any(real == "amd64" for _, real in pairs)

          ghcr_missing = []
          for svc in svcs:
              repo = f"{owner}/{svc}"
              pairs, digest = real_arches("ghcr.io", repo, version, ghcr_token(repo))
              print(svc, "ghcr", pairs, digest)
              if not amd64_ok(pairs):
                  ghcr_missing.append(svc)

          cnb_bad = []
          if cnb_repo:
              for svc in svcs:
                  repo = f"{cnb_repo}/{svc}"
                  try:
                      pairs, digest = real_arches("docker.cnb.cool", repo, version, cnb_token(repo))
                  except Exception as e:
                      print(svc, "cnb inspect error", e)
                      cnb_bad.append(svc)
                      continue
                  print(svc, "cnb", pairs, digest)
                  if not amd64_ok(pairs):
                      cnb_bad.append(svc)
          else:
              cnb_bad = list(svcs)

          skip = "false" if ghcr_missing else "true"
          copy = "true" if cnb_bad else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"skip={skip}\n")
              f.write(f"copy={copy}\n")
          print("skip", skip, "ghcr_missing", ",".join(ghcr_missing) or "-")
          print("copy", copy, "cnb_bad", ",".join(cnb_bad) or "-")
          PY

      - name: 准备 JDK 17
        if: steps.published.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: 打包 JAR
        if: steps.published.outputs.skip != 'true'
        run: mvn -B -DskipTests -T 1C clean package

      - name: 登录 GHCR
        if: steps.published.outputs.skip != 'true' || steps.published.outputs.copy == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 GHCR 镜像
        if: steps.published.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          src="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          for svc in ${SERVICES}; do
            img="ghcr.io/${owner}/${svc}"
            docker build \
              --build-arg BASE_IMAGE=eclipse-temurin:17-jre \
              --label "org.opencontainers.image.source=${src}" \
              --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
              --label "org.opencontainers.image.version=${VERSION}" \
              --label "org.opencontainers.image.title=${svc}" \
              -t "${img}:${VERSION}" \
              "$svc"
            docker push "${img}:${VERSION}"
          done

      - name: 公开 GHCR 包
        if: steps.published.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER}"
          for svc in ${SERVICES}; do
            gh api --method PUT \
              "/users/${owner}/packages/container/${svc}/visibility" \
              -f visibility=public || true
          done

      - name: 登录 CNB
        if: steps.published.outputs.copy == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.cnb.cool
          username: cnb
          password: ${{ secrets.CNB_TOKEN }}

      - name: 拷贝 GHCR 镜像到 CNB
        if: steps.published.outputs.copy == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${CNB_REPO}" ]; then
            echo "缺少 GitHub Variable: CNB_REPO，例如 baorui.xyz/jeepay" >&2
            exit 1
          fi
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          for svc in ${SERVICES}; do
            src="ghcr.io/${owner}/${svc}:${VERSION}"
            dst="docker.cnb.cool/${CNB_REPO}/${svc}:${VERSION}"
            docker pull "$src"
            arch="$(docker image inspect --format '{{.Architecture}}' "$src")"
            if [ "$arch" != "amd64" ]; then
              echo "$src Architecture=${arch}，拒绝拷贝" >&2
              exit 1
            fi
            docker tag "$src" "$dst"
            docker push "$dst"
            echo "copied ${src} -> ${dst} arch=${arch}"
          done

      - name: 同步代码到 CNB
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${CNB_TOKEN}" ]; then
            echo "缺少 GitHub Secret: CNB_TOKEN" >&2
            exit 1
          fi

          api="https://api.cnb.cool"
          auth_hdr() {
            curl -sS "$@" \
              -H "Authorization: Bearer ${CNB_TOKEN}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json"
          }

          if [ -z "${CNB_REPO}" ]; then
            username="$(auth_hdr "${api}/user" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("username",""))')"
            if [ -z "$username" ]; then
              echo "无法读取 CNB 用户名，请设置变量 CNB_REPO，例如 my-org/jeepay" >&2
              exit 1
            fi
            group="$(auth_hdr "${api}/user/groups?page=1&page_size=50&role=Owner" | python3 -c 'import json,sys; data=json.load(sys.stdin); items=data if isinstance(data,list) else data.get("data") or data.get("items") or []; print((items[0].get("path") or items[0].get("name") or "") if items else "")')"
            if [ -z "$group" ]; then
              echo "未找到 Owner 组织，尝试创建 ${username}"
              auth_hdr -X POST "${api}/groups" \
                -d "{\"path\":\"${username}\",\"description\":\"personal\"}" >/tmp/cnb-group.json || true
              group="$username"
            fi
            CNB_REPO="${group}/jeepay"
            echo "使用 CNB 仓库 ${CNB_REPO}"
          fi

          group="${CNB_REPO%/*}"
          name="${CNB_REPO##*/}"
          code="$(curl -sS -o /tmp/cnb-repo.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CNB_TOKEN}" \
            -H "Accept: application/json" \
            "${api}/${CNB_REPO}")"
          if [ "$code" = "404" ]; then
            echo "创建 CNB 仓库 ${CNB_REPO}"
            auth_hdr -X POST "${api}/${group}/-/repos" \
              -d "{\"name\":\"${name}\",\"visibility\":\"public\",\"description\":\"Jeepay public fork mirror from GitHub\"}"
          elif [ "$code" != "200" ]; then
            echo "查询 CNB 仓库失败 HTTP ${code}" >&2
            cat /tmp/cnb-repo.json >&2 || true
            exit 1
          fi

          git push --force "https://cnb:${CNB_TOKEN}@cnb.cool/${CNB_REPO}" "HEAD:refs/heads/master"
          echo "已同步代码到 CNB ${CNB_REPO}，版本 ${VERSION} 镜像由 GitHub 拷贝，不触发 CNB 构建。"

      - name: 核验 CNB 镜像为 linux/amd64
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${CNB_REPO}" ]; then
            echo "缺少 GitHub Variable: CNB_REPO" >&2
            exit 1
          fi
          python3 - "$VERSION" "$CNB_REPO" $SERVICES <<'PY'
          import json, sys, urllib.request, urllib.error

          version, cnb_repo, *svcs = sys.argv[1:]
          accept = (
              "application/vnd.oci.image.index.v1+json, "
              "application/vnd.docker.distribution.manifest.list.v2+json, "
              "application/vnd.oci.image.manifest.v1+json, "
              "application/vnd.docker.distribution.manifest.v2+json"
          )

          def cnb_token(repo):
              req = urllib.request.Request("https://docker.cnb.cool/v2/")
              try:
                  urllib.request.urlopen(req, timeout=20)
                  return ""
              except urllib.error.HTTPError as e:
                  www = e.headers.get("Www-Authenticate") or e.headers.get("WWW-Authenticate") or ""
                  kv = {}
                  if " " in www:
                      for item in www.split(" ", 1)[1].split(","):
                          if "=" in item:
                              k, v = item.split("=", 1)
                              kv[k.strip()] = v.strip().strip('"')
                  realm = kv.get("realm") or "https://docker.cnb.cool/service/token"
                  service = kv.get("service") or "cnb-registry"
                  sep = "&" if "?" in realm else "?"
                  url = f"{realm}{sep}service={service}&scope=repository:{repo}:pull"
                  with urllib.request.urlopen(url, timeout=20) as r:
                      data = json.loads(r.read())
                  return data.get("token") or data.get("access_token") or ""

          def get_manifest(repo, ref, token):
              req = urllib.request.Request(f"https://docker.cnb.cool/v2/{repo}/manifests/{ref}")
              if token:
                  req.add_header("Authorization", f"Bearer {token}")
              req.add_header("Accept", accept)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read()), r.headers.get("Docker-Content-Digest") or ""

          def config_arch(repo, manifest, token):
              cfg = (manifest.get("config") or {}).get("digest")
              req = urllib.request.Request(f"https://docker.cnb.cool/v2/{repo}/blobs/{cfg}")
              if token:
                  req.add_header("Authorization", f"Bearer {token}")
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read()).get("architecture") or ""

          bad = []
          for svc in svcs:
              repo = f"{cnb_repo}/{svc}"
              token = cnb_token(repo)
              man, digest = get_manifest(repo, version, token)
              arches = []
              if man.get("manifests"):
                  for m in man["manifests"]:
                      labeled = (m.get("platform") or {}).get("architecture") or ""
                      if labeled in ("", "unknown"):
                          continue
                      child, _ = get_manifest(repo, m["digest"], token)
                      real = config_arch(repo, child, token)
                      arches.append((labeled, real))
              else:
                  arches.append(("single", config_arch(repo, man, token)))
              print(svc, digest, arches)
              ok = any(real == "amd64" for _, real in arches) and all(
                  real == "amd64" for labeled, real in arches if labeled == "amd64"
              )
              if not ok:
                  bad.append(f"{svc} {digest} {arches}")
          if bad:
              print("CNB 镜像不是可运行的 linux/amd64:", "; ".join(bad), file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: 清理非版本标签
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER}"
          python3 - "$owner" "${CNB_REPO:-}" $SERVICES <<'PY'
          import json, os, sys, urllib.error, urllib.request

          owner, cnb_repo, *svcs = sys.argv[1:]
          cnb_token = os.environ.get("CNB_TOKEN") or ""

          def gh(url, method="GET"):
              req = urllib.request.Request(url, method=method, headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {__import__('os').environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()

          def cnb(url, method="GET"):
              req = urllib.request.Request(url, method=method, headers={
                  "Accept": "application/json",
                  "Authorization": f"Bearer {cnb_token}",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()

          def is_version_tag(name):
              return name.startswith("v") and len(name) > 1 and name[1].isdigit()

          print("清理 GHCR")
          for svc in svcs:
              st, body = gh(f"https://api.github.com/users/{owner}/packages/container/{svc}/versions?per_page=100")
              if st != 200:
                  print(svc, "list", st, body[:200])
                  continue
              for v in json.loads(body):
                  vid = v.get("id")
                  tags = ((v.get("metadata") or {}).get("container") or {}).get("tags") or []
                  if any(is_version_tag(t) for t in tags):
                      print(svc, "keep", tags)
                      continue
                  dst, dbody = gh(
                      f"https://api.github.com/users/{owner}/packages/container/{svc}/versions/{vid}",
                      method="DELETE",
                  )
                  print(svc, "delete", vid, tags, "->", dst)

          if not cnb_token or not cnb_repo:
              print("缺少 CNB_TOKEN 或 CNB_REPO，跳过 CNB 清理")
              raise SystemExit(0)

          print("清理 CNB")
          for svc in svcs:
              st, body = cnb(f"https://api.cnb.cool/{cnb_repo}/-/packages/docker/{cnb_repo.split('/')[-1]}/{svc}/-/tags")
              if st != 200:
                  print(svc, "list", st, body[:200])
                  continue
              for t in json.loads(body).get("docker") or []:
                  name = t.get("name") or ""
                  if is_version_tag(name):
                      print(svc, "keep", name)
                      continue
                  dst, dbody = cnb(
                      f"https://api.cnb.cool/{cnb_repo}/-/packages/docker/{cnb_repo.split('/')[-1]}/{svc}/-/tag/{name}",
                      method="DELETE",
                  )
                  print(svc, "delete", name, "->", dst)
          PY
