# 本文件属于 Fork overlay：上游同步后必须保留。
# 职责：每小时对齐 jeequan/jeepay；GitHub 把代码推到 CNB，并触发 CNB 按这份代码构建镜像。
# 生产只拉 CNB 制品。不要把 GHCR 镜像拷到 CNB。GHCR 已有同版本时仍要触发 CNB 重建。
name: 同步上游并发布镜像

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: jeepay-mirror
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  UPSTREAM_REPO: jeequan/jeepay
  OVERLAY_FILES: ".github/workflows/mirror-release.yml .cnb.yml"
  SERVICES: "jeepay-manager jeepay-merchant jeepay-payment"

jobs:
  sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: 同步上游 master
        id: sync
        env:
          OVERLAY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin master
          git checkout -B master origin/master

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || true
          git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "已包含上游最新提交，无需同步"
            exit 0
          fi

          restore_overlay() {
            # 用启动本次工作流的版本覆盖 overlay，避免被上游同名文件带走
            # shellcheck disable=SC2086
            git checkout "$OVERLAY_SHA" -- $OVERLAY_FILES
            # shellcheck disable=SC2086
            git add -- $OVERLAY_FILES
          }

          # GITHUB_TOKEN 不能创建或更新 workflow 文件。overlay 以外的
          # .github/workflows 保持本仓库当前版本，不随上游带走。
          drop_non_overlay_workflows() {
            local f
            {
              git diff --name-only --cached -- .github/workflows
              git ls-files -u -- .github/workflows | awk '{print $4}'
            } | sort -u | while read -r f; do
              [ -z "$f" ] && continue
              case " ${OVERLAY_FILES} " in
                *" ${f} "*) continue ;;
              esac
              if git cat-file -e "HEAD:${f}" 2>/dev/null; then
                echo "不同步上游 workflow: 还原 ${f}"
                git checkout HEAD -- "$f"
              else
                echo "不同步上游 workflow: 去掉 ${f}"
                git rm -f --ignore-unmatch -- "$f"
              fi
            done
          }

          git merge --no-commit --no-ff upstream/master || true
          if [ ! -f .git/MERGE_HEAD ]; then
            echo "上游合并未开始" >&2
            git status
            exit 1
          fi

          restore_overlay
          drop_non_overlay_workflows

          leftover="$(git ls-files -u | awk '{print $4}' | sort -u | grep -v -E '^(\.github/workflows/mirror-release\.yml|\.cnb\.yml)$' || true)"
          if [ -n "$leftover" ]; then
            echo "存在无法自动解决的合并冲突:" >&2
            echo "$leftover" >&2
            git status
            exit 1
          fi

          git commit --no-edit
          git push origin HEAD:master
          echo "changed=true" >> "$GITHUB_OUTPUT"

  release:
    needs: sync
    if: |
      always() &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (needs.sync.result == 'success' && needs.sync.outputs.changed == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
      CNB_REPO: ${{ vars.CNB_REPO }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: 解析版本
        id: ver
        run: |
          set -euo pipefail
          raw="$(sed -n 's/.*<isys.version>\([^<]*\)<\/isys.version>.*/\1/p' pom.xml | head -1 | tr -d '[:space:]')"
          if ! echo "$raw" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "pom.xml isys.version 必须是 x.y.z，当前是: ${raw}" >&2
            exit 1
          fi
          echo "version=v${raw}" >> "$GITHUB_OUTPUT"
          echo "使用版本 v${raw}"

      - name: 检查版本是否已发布
        id: published
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          python3 - "$owner" "$VERSION" $SERVICES <<'PY'
          import json, os, sys, urllib.request, urllib.error
          owner, version, *svcs = sys.argv[1:]
          missing = []
          for svc in svcs:
              tok_url = f"https://ghcr.io/token?service=ghcr.io&scope=repository:{owner}/{svc}:pull"
              with urllib.request.urlopen(tok_url, timeout=20) as r:
                  token = json.load(r).get("token") or ""
              req = urllib.request.Request(f"https://ghcr.io/v2/{owner}/{svc}/manifests/{version}")
              req.add_header("Authorization", f"Bearer {token}")
              req.add_header("Accept", "application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.index.v1+json")
              try:
                  urllib.request.urlopen(req, timeout=20)
              except urllib.error.HTTPError:
                  missing.append(svc)
          skip = "false" if missing else "true"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"skip={skip}\n")
          print("skip", skip, "missing", ",".join(missing) or "-")
          PY

      - name: 准备 JDK 17
        if: steps.published.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: 打包 JAR
        if: steps.published.outputs.skip != 'true'
        run: mvn -B -DskipTests -T 1C clean package

      - name: 登录 GHCR
        if: steps.published.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 GHCR 镜像
        if: steps.published.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          src="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          for svc in ${SERVICES}; do
            img="ghcr.io/${owner}/${svc}"
            docker build \
              --build-arg BASE_IMAGE=eclipse-temurin:17-jre \
              --label "org.opencontainers.image.source=${src}" \
              --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
              --label "org.opencontainers.image.version=${VERSION}" \
              --label "org.opencontainers.image.title=${svc}" \
              -t "${img}:${VERSION}" \
              "$svc"
            docker push "${img}:${VERSION}"
          done

      - name: 公开 GHCR 包
        if: steps.published.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER}"
          for svc in ${SERVICES}; do
            gh api --method PUT \
              "/users/${owner}/packages/container/${svc}/visibility" \
              -f visibility=public || true
          done

      - name: 推送到 CNB 并触发流水线
        id: cnb
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${CNB_TOKEN}" ]; then
            echo "缺少 GitHub Secret: CNB_TOKEN" >&2
            exit 1
          fi

          api="https://api.cnb.cool"
          auth_hdr() {
            curl -sS "$@" \
              -H "Authorization: Bearer ${CNB_TOKEN}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json"
          }

          if [ -z "${CNB_REPO}" ]; then
            username="$(auth_hdr "${api}/user" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("username",""))')"
            if [ -z "$username" ]; then
              echo "无法读取 CNB 用户名，请设置变量 CNB_REPO，例如 my-org/jeepay" >&2
              exit 1
            fi
            group="$(auth_hdr "${api}/user/groups?page=1&page_size=50&role=Owner" | python3 -c 'import json,sys; data=json.load(sys.stdin); items=data if isinstance(data,list) else data.get("data") or data.get("items") or []; print((items[0].get("path") or items[0].get("name") or "") if items else "")')"
            if [ -z "$group" ]; then
              echo "未找到 Owner 组织，尝试创建 ${username}"
              auth_hdr -X POST "${api}/groups" \
                -d "{\"path\":\"${username}\",\"description\":\"personal\"}" >/tmp/cnb-group.json || true
              group="$username"
            fi
            CNB_REPO="${group}/jeepay"
            echo "使用 CNB 仓库 ${CNB_REPO}"
          fi
          echo "cnb_repo=${CNB_REPO}" >> "$GITHUB_OUTPUT"

          group="${CNB_REPO%/*}"
          name="${CNB_REPO##*/}"
          code="$(curl -sS -o /tmp/cnb-repo.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CNB_TOKEN}" \
            -H "Accept: application/json" \
            "${api}/${CNB_REPO}")"
          if [ "$code" = "404" ]; then
            echo "创建 CNB 仓库 ${CNB_REPO}"
            auth_hdr -X POST "${api}/${group}/-/repos" \
              -d "{\"name\":\"${name}\",\"visibility\":\"public\",\"description\":\"Jeepay public fork mirror from GitHub\"}"
          elif [ "$code" != "200" ]; then
            echo "查询 CNB 仓库失败 HTTP ${code}" >&2
            cat /tmp/cnb-repo.json >&2 || true
            exit 1
          fi

          git push --force "https://cnb:${CNB_TOKEN}@cnb.cool/${CNB_REPO}" "HEAD:refs/heads/master"

          # GHCR 已有同版本也不能跳过 CNB：制品必须由 CNB 按这份代码构建。
          curl -sS -o /tmp/cnb-build.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CNB_TOKEN}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "${api}/${CNB_REPO}/-/build/start" \
            -d "{\"event\":\"api_trigger\",\"branch\":\"master\",\"title\":\"release ${VERSION}\"}" \
            >/tmp/cnb-build.code
          echo "CNB 构建触发 HTTP $(cat /tmp/cnb-build.code)"
          case "$(cat /tmp/cnb-build.code)" in
            200|201) ;;
            *)
              echo "CNB 构建触发失败" >&2
              cat /tmp/cnb-build.json >&2 || true
              exit 1
              ;;
          esac
          python3 - <<'PY'
          import json, os
          d = json.load(open("/tmp/cnb-build.json"))
          sn = d.get("sn") or ""
          print("sn", sn)
          print("url", d.get("buildLogUrl") or "")
          if not d.get("success", True):
              raise SystemExit("CNB 未接受构建触发")
          if not sn:
              raise SystemExit("CNB 构建未返回 sn")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"sn={sn}\n")
          PY

      - name: 等待 CNB 构建完成
        env:
          CNB_SN: ${{ steps.cnb.outputs.sn }}
          CNB_REPO: ${{ steps.cnb.outputs.cnb_repo || vars.CNB_REPO }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request

          api = "https://api.cnb.cool"
          repo = os.environ["CNB_REPO"]
          sn = os.environ["CNB_SN"]
          token = os.environ["CNB_TOKEN"]
          deadline = time.time() + 70 * 60
          done = {"success", "succeeded", "complete", "completed", "finish", "finished", "ok"}
          fail = {"failed", "fail", "error", "cancel", "cancelled", "canceled", "stopped", "timeout", "timed_out"}

          def load_status():
              req = urllib.request.Request(f"{api}/{repo}/-/build/status/{sn}")
              req.add_header("Authorization", f"Bearer {token}")
              req.add_header("Accept", "application/vnd.cnb.api+json, application/json")
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          last = ""
          while time.time() < deadline:
              try:
                  data = load_status()
              except urllib.error.HTTPError as e:
                  print("status http", e.code, flush=True)
                  time.sleep(15)
                  continue
              status = (data.get("status") or "").strip()
              pipes = data.get("pipelinesStatus") or {}
              pipe_st = [((v or {}).get("status") or "") for v in pipes.values()] if isinstance(pipes, dict) else []
              line = status + " " + ",".join(pipe_st)
              if line != last:
                  print("status", status, "pipelines", pipe_st or "-", flush=True)
                  last = line
              s = status.lower()
              ps = [x.lower() for x in pipe_st]
              if s in fail or any(x in fail for x in ps):
                  print("CNB 构建失败", json.dumps(data)[:1500], flush=True)
                  sys.exit(1)
              if s in done or (ps and all(x in done for x in ps)):
                  print("CNB 构建完成", flush=True)
                  sys.exit(0)
              time.sleep(30)
          print("等待 CNB 构建超时", sn, flush=True)
          sys.exit(1)
          PY

      - name: 核验 CNB 镜像为 linux/amd64
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          CNB_REPO: ${{ steps.cnb.outputs.cnb_repo || vars.CNB_REPO }}
        run: |
          set -euo pipefail
          python3 - "$VERSION" "$CNB_REPO" $SERVICES <<'PY'
          import base64, json, os, sys, urllib.request

          version, repo, *svcs = sys.argv[1:]
          token = os.environ["CNB_TOKEN"]
          auth = base64.b64encode(f"cnb:{token}".encode()).decode()

          def get(url, accept):
              req = urllib.request.Request(url)
              req.add_header("Authorization", f"Basic {auth}")
              req.add_header("Accept", accept)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)

          def config_arch(name, digest=None):
              ref = digest or version
              man = get(
                  f"https://docker.cnb.cool/v2/{name}/manifests/{ref}",
                  "application/vnd.docker.distribution.manifest.v2+json, "
                  "application/vnd.oci.image.manifest.v1+json, "
                  "application/vnd.oci.image.index.v1+json, "
                  "application/vnd.docker.distribution.manifest.list.v2+json",
              )
              media = man.get("mediaType") or ""
              if "index" in media or man.get("manifests"):
                  amd = [
                      m for m in man.get("manifests") or []
                      if (m.get("platform") or {}).get("architecture") == "amd64"
                      and (m.get("platform") or {}).get("os") == "linux"
                  ]
                  if not amd:
                      raise SystemExit(f"{name}:{ref} 清单没有 linux/amd64")
                  return config_arch(name, amd[0]["digest"])
              cfg_digest = (man.get("config") or {}).get("digest")
              if not cfg_digest:
                  raise SystemExit(f"{name}:{ref} 没有 config digest")
              cfg = get(
                  f"https://docker.cnb.cool/v2/{name}/blobs/{cfg_digest}",
                  "application/json, application/vnd.docker.container.image.v1+json, "
                  "application/vnd.oci.image.config.v1+json",
              )
              return cfg.get("architecture") or "", cfg_digest, man.get("config", {}).get("digest")

          failed = 0
          for svc in svcs:
              name = f"{repo}/{svc}"
              # 再取一次清单 digest 供生产钉 pin
              req = urllib.request.Request(f"https://docker.cnb.cool/v2/{name}/manifests/{version}")
              req.add_header("Authorization", f"Basic {auth}")
              req.add_header(
                  "Accept",
                  "application/vnd.docker.distribution.manifest.v2+json, "
                  "application/vnd.oci.image.manifest.v1+json, "
                  "application/vnd.oci.image.index.v1+json, "
                  "application/vnd.docker.distribution.manifest.list.v2+json",
              )
              with urllib.request.urlopen(req, timeout=60) as r:
                  digest = r.headers.get("Docker-Content-Digest") or ""
                  man = json.load(r)
              arch, cfg_digest, _ = config_arch(name)
              print(svc, "digest", digest, "config", cfg_digest, "arch", arch)
              if arch != "amd64":
                  print(svc, "不是 amd64", file=sys.stderr)
                  failed = 1
          if failed:
              raise SystemExit("CNB 镜像 architecture 不是 amd64")
          PY

      - name: 清理非版本标签
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER}"
          python3 - "$owner" "${CNB_REPO:-}" $SERVICES <<'PY'
          import json, os, sys, urllib.error, urllib.request

          owner, cnb_repo, *svcs = sys.argv[1:]
          cnb_token = os.environ.get("CNB_TOKEN") or ""

          def gh(url, method="GET"):
              req = urllib.request.Request(url, method=method, headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {__import__('os').environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()

          def cnb(url, method="GET"):
              req = urllib.request.Request(url, method=method, headers={
                  "Accept": "application/json",
                  "Authorization": f"Bearer {cnb_token}",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()

          def is_version_tag(name):
              return name.startswith("v") and len(name) > 1 and name[1].isdigit()

          print("清理 GHCR")
          for svc in svcs:
              st, body = gh(f"https://api.github.com/users/{owner}/packages/container/{svc}/versions?per_page=100")
              if st != 200:
                  print(svc, "list", st, body[:200])
                  continue
              for v in json.loads(body):
                  vid = v.get("id")
                  tags = ((v.get("metadata") or {}).get("container") or {}).get("tags") or []
                  if any(is_version_tag(t) for t in tags):
                      print(svc, "keep", tags)
                      continue
                  dst, dbody = gh(
                      f"https://api.github.com/users/{owner}/packages/container/{svc}/versions/{vid}",
                      method="DELETE",
                  )
                  print(svc, "delete", vid, tags, "->", dst)

          if not cnb_token or not cnb_repo:
              print("缺少 CNB_TOKEN 或 CNB_REPO，跳过 CNB 清理")
              raise SystemExit(0)

          print("清理 CNB")
          for svc in svcs:
              st, body = cnb(f"https://api.cnb.cool/{cnb_repo}/-/packages/docker/{cnb_repo.split('/')[-1]}/{svc}/-/tags")
              if st != 200:
                  print(svc, "list", st, body[:200])
                  continue
              for t in json.loads(body).get("docker") or []:
                  name = t.get("name") or ""
                  if is_version_tag(name):
                      print(svc, "keep", name)
                      continue
                  dst, dbody = cnb(
                      f"https://api.cnb.cool/{cnb_repo}/-/packages/docker/{cnb_repo.split('/')[-1]}/{svc}/-/tag/{name}",
                      method="DELETE",
                  )
                  print(svc, "delete", name, "->", dst)
          PY
